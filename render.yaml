services:
  - type: web
    name: lunalens-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements-render.txt
    startCommand: gunicorn --chdir backend/server app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: ALLOW_EXTERNAL_ACCESS
        value: true
      - key: ENABLE_QGIS_ANALYSIS
        value: false
      # Optional: set public model file URLs if weights are not in the repo.
      # - key: YOLO_MODEL_URL
      #   value: https://example.com/best.pt
      # - key: VIT_MODEL_URL
      #   value: https://example.com/vit_model.pth
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
